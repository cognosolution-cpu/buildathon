<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="VibeCart 3D Hybrid AI & Voice Pipeline Flow">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181513" />
      <stop offset="100%" stop-color="#0C0B0A" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="50%" stop-color="#FFA040" />
      <stop offset="100%" stop-color="#2EE59D" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="1184" height="204" rx="20" fill="#050505" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" />

  <!-- Connecting Animated Energy Rail -->
  <line x1="160" y1="110" x2="1040" y2="110" stroke="url(#pipeGrad)" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.55">
    <animate attributeName="stroke-dashoffset" values="32;0" dur="1.4s" repeatCount="indefinite" />
  </line>

  <!-- Flowing Pulse Dot -->
  <circle cx="160" cy="110" r="5" fill="#FFA040" filter="url(#glow)">
    <animate attributeName="cx" values="160;1040" dur="3.6s" repeatCount="indefinite" />
  </circle>

  <!-- Card 1: 3D Depth Rule Engine -->
  <g transform="translate(36, 36)">
    <rect x="6" y="8" width="252" height="142" rx="16" fill="#FF6A00" opacity="0.16" />
    <rect x="0" y="0" width="252" height="142" rx="16" fill="url(#cardBg)" stroke="rgba(255,106,0,0.55)" stroke-width="1.3" />
    <rect x="18" y="18" width="76" height="22" rx="7" fill="rgba(255,106,0,0.18)" />
    <text x="28" y="33" fill="#FFA040" font-family="ui-monospace, monospace" font-size="11" font-weight="700">0ms · L1</text>
    <text x="18" y="64" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Rule Engine</text>
    <text x="18" y="86" fill="#9A9A9A" font-family="system-ui, sans-serif" font-size="12">Instant deterministic match</text>
    <text x="18" y="104" fill="#9A9A9A" font-family="system-ui, sans-serif" font-size="12">for cart, checkout, view</text>
    <text x="18" y="122" fill="#2EE59D" font-family="ui-monospace, monospace" font-size="11">ruleParser.ts</text>
  </g>

  <!-- Card 2: Gemini 3.1 Flash Lite -->
  <g transform="translate(328, 36)">
    <rect x="6" y="8" width="252" height="142" rx="16" fill="#FFA040" opacity="0.16" />
    <rect x="0" y="0" width="252" height="142" rx="16" fill="url(#cardBg)" stroke="rgba(255,160,64,0.55)" stroke-width="1.3" />
    <rect x="18" y="18" width="88" height="22" rx="7" fill="rgba(255,160,64,0.18)" />
    <text x="28" y="33" fill="#FFA040" font-family="ui-monospace, monospace" font-size="11" font-weight="700">LLM · L2</text>
    <text x="18" y="64" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Gemini 3.1 Lite</text>
    <text x="18" y="86" fill="#9A9A9A" font-family="system-ui, sans-serif" font-size="12">Strict JSON schema NLU</text>
    <text x="18" y="104" fill="#9A9A9A" font-family="system-ui, sans-serif" font-size="12">Hinglish + 5 Indian langs</text>
    <text x="18" y="122" fill="#4DA3FF" font-family="ui-monospace, monospace" font-size="11">/api/nlu + llm-proxy</text>
  </g>

  <!-- Card 3: Intent Guard + Store -->
  <g transform="translate(620, 36)">
    <rect x="6" y="8" width="252" height="142" rx="16" fill="#4DA3FF" opacity="0.14" />
    <rect x="0" y="0" width="252" height="142" rx="16" fill="url(#cardBg)" stroke="rgba(77,163,255,0.5)" stroke-width="1.3" />
    <rect x="18" y="18" width="96" height="22" rx="7" fill="rgba(77,163,255,0.16)" />
    <text x="28" y="33" fill="#4DA3FF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">GUARD · L3</text>
    <text x="18" y="64" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Validator + UI</text>
    <text x="18" y="86" fill="#9A9A9A" font-family="system-ui, sans-serif" font-size="12">Sanitizes entities &amp; blocks</text>
    <text x="18" y="104" fill="#9A9A9A" font-family="system-ui, sans-serif" font-size="12">out-of-scope UNKNOWN safely</text>
    <text x="18" y="122" fill="#2EE59D" font-family="ui-monospace, monospace" font-size="11">intentValidator.ts</text>
  </g>

  <!-- Card 4: Murf + Agora Voice -->
  <g transform="translate(912, 36)">
    <rect x="6" y="8" width="252" height="142" rx="16" fill="#2EE59D" opacity="0.14" />
    <rect x="0" y="0" width="252" height="142" rx="16" fill="url(#cardBg)" stroke="rgba(46,229,157,0.55)" stroke-width="1.3" />
    <rect x="18" y="18" width="100" height="22" rx="7" fill="rgba(46,229,157,0.16)" />
    <text x="28" y="33" fill="#2EE59D" font-family="ui-monospace, monospace" font-size="11" font-weight="700">VOICE · L4</text>
    <text x="18" y="64" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Murf + Agora AI</text>
    <text x="18" y="86" fill="#9A9A9A" font-family="system-ui, sans-serif" font-size="12">Falcon 2 Indian TTS audio</text>
    <text x="18" y="104" fill="#9A9A9A" font-family="system-ui, sans-serif" font-size="12">&amp; live Agora RTC sessions</text>
    <text x="18" y="122" fill="#FFA040" font-family="ui-monospace, monospace" font-size="11">/api/tts/murf + agora/*</text>
  </g>
</svg>
