<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="VoicoCart 3D Voice-First Commerce Hero Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0908" />
      <stop offset="45%" stop-color="#050505" />
      <stop offset="100%" stop-color="#0a0705" />
    </linearGradient>

    <radialGradient id="copperGlow" cx="18%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#E34A00" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="amberGlow" cx="82%" cy="62%" r="48%">
      <stop offset="0%" stop-color="#FFA040" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#FF6A00" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbCore" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFD29D" />
      <stop offset="35%" stop-color="#FFA040" />
      <stop offset="75%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#B83B00" />
    </radialGradient>

    <linearGradient id="isoTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25201D" />
      <stop offset="100%" stop-color="#141211" />
    </linearGradient>
    <linearGradient id="isoLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1715" />
      <stop offset="100%" stop-color="#0D0C0B" />
    </linearGradient>
    <linearGradient id="isoRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12100F" />
      <stop offset="100%" stop-color="#080707" />
    </linearGradient>

    <linearGradient id="copperTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA040" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>
    <linearGradient id="copperLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E34A00" />
      <stop offset="100%" stop-color="#8F2D00" />
    </linearGradient>
    <linearGradient id="copperRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B83B00" />
      <stop offset="100%" stop-color="#5E1D00" />
    </linearGradient>

    <linearGradient id="emeraldBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2EE59D" />
      <stop offset="100%" stop-color="#0D9662" />
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="isoGrid" width="48" height="28" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 48 14 L 24 28 L 0 14 Z" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="8" y="8" width="1184" height="414" rx="24" />
    </clipPath>
  </defs>

  <!-- Outer Obsidian Frame -->
  <rect x="8" y="8" width="1184" height="414" rx="24" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <g clip-path="url(#cardClip)">
    <!-- Subtle 3D Isometric Floor Grid + Atmospheric Copper Lights -->
    <rect x="8" y="8" width="1184" height="414" fill="url(#isoGrid)" />
    <rect x="8" y="8" width="1184" height="414" fill="url(#copperGlow)" />
    <rect x="8" y="8" width="1184" height="414" fill="url(#amberGlow)" />

    <!-- Top Right Live Badge -->
    <g transform="translate(888, 34)">
      <rect x="0" y="0" width="268" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,160,64,0.35)" stroke-width="1" />
      <circle cx="20" cy="16" r="4.5" fill="#2EE59D">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="20" fill="#F5F5F5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.6">AGORA AI + MURF FALCON 2 + 3D</text>
    </g>

    <!-- LEFT SECTION: Brand Orb + Title + Feature Pills -->
    <g transform="translate(54, 48)">
      <!-- Pulsing Concentric Acoustic Rings -->
      <circle cx="38" cy="38" r="28" fill="none" stroke="#FF6A00" stroke-width="1.5" opacity="0.55">
        <animate attributeName="r" values="28;44;28" dur="3.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.65;0;0.65" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="38" cy="38" r="24" fill="none" stroke="#FFA040" stroke-width="1.2" opacity="0.65">
        <animate attributeName="r" values="24;38;24" dur="3.2s" begin="1.1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;0;0.7" dur="3.2s" begin="1.1s" repeatCount="indefinite" />
      </circle>

      <!-- Glowing 3D Copper Orb -->
      <circle cx="38" cy="38" r="26" fill="url(#orbCore)" filter="url(#softGlow)" />
      <!-- Soundwave inside Orb -->
      <rect x="27" y="32" width="3.5" height="12" rx="1.75" fill="#050505">
        <animate attributeName="height" values="12;20;8;12" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="32;28;34;32" dur="1.4s" repeatCount="indefinite" />
      </rect>
      <rect x="33.5" y="27" width="3.5" height="22" rx="1.75" fill="#050505">
        <animate attributeName="height" values="22;10;24;22" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="27;33;26;27" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="40" y="29" width="3.5" height="18" rx="1.75" fill="#050505">
        <animate attributeName="height" values="18;24;11;18" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="29;26;32.5;29" dur="1.3s" repeatCount="indefinite" />
      </rect>
      <rect x="46.5" y="33" width="3.5" height="10" rx="1.75" fill="#050505">
        <animate attributeName="height" values="10;18;9;10" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="33;29;33.5;33" dur="1.5s" repeatCount="indefinite" />
      </rect>

      <!-- Brand Title -->
      <text x="86" y="34" fill="#FFA040" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="2">VOICE-FIRST SPATIAL COMMERCE</text>
      <text x="86" y="66" fill="#F5F5F5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" letter-spacing="-0.8">Voico<tspan fill="#FF6A00">Cart</tspan></text>
    </g>

    <!-- Main Tagline & Subtitle -->
    <text x="54" y="170" fill="#F5F5F5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.4">
      Shop by talking, in your language.
    </text>
    <text x="54" y="205" fill="#9A9A9A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5">
      Interactive 3D inspection, multilingual AI voice shopping across 5 Indian languages,
    </text>
    <text x="54" y="228" fill="#9A9A9A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5">
      real-time Supabase sync, verified Razorpay checkout &amp; installable Mobile PWA.
    </text>

    <!-- Animated Command Prompt Simulation Box -->
    <g transform="translate(54, 256)">
      <rect x="0" y="0" width="540" height="52" rx="16" fill="rgba(24,23,23,0.88)" stroke="rgba(255,106,0,0.45)" stroke-width="1.2" />
      <circle cx="26" cy="26" r="11" fill="rgba(255,106,0,0.18)" />
      <circle cx="26" cy="26" r="4.5" fill="#FF6A00">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="48" y="31" fill="#F5F5F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">
        "Add PulseBuds Air ANC and redirect to checkout"
      </text>
      <rect x="444" y="10" width="84" height="32" rx="10" fill="url(#copperTop)" />
      <text x="467" y="30" fill="#050505" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700">Ask AI</text>
    </g>

    <!-- 3D Glass Tech Pills -->
    <g transform="translate(54, 330)">
      <rect x="0" y="0" width="124" height="30" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" />
      <text x="16" y="19" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">⚡ Gemini 3.1 Lite</text>

      <rect x="134" y="0" width="122" height="30" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" />
      <text x="150" y="19" fill="#FFA040" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">🎙️ Murf Falcon 2</text>

      <rect x="266" y="0" width="118" height="30" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" />
      <text x="282" y="19" fill="#2EE59D" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">🧊 Three.js 3D</text>

      <rect x="394" y="0" width="146" height="30" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" />
      <text x="410" y="19" fill="#4DA3FF" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">📱 Installable PWA</text>
    </g>

    <!-- Creator Credit Line -->
    <text x="54" y="395" fill="#9A9A9A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5">
      Engineered by <tspan fill="#F5F5F5" font-weight="700">Piyush Joshi</tspan> · <tspan fill="#FFA040">piyushaundhekar@gmail.com</tspan>
    </text>

    <!-- RIGHT SECTION: FLOATING 3D ISOMETRIC STACKED ARCHITECTURE -->
    <g transform="translate(880, 230)">
      <!-- Floor Shadow -->
      <ellipse cx="0" cy="135" rx="185" ry="44" fill="#FF6A00" opacity="0.14" filter="url(#softGlow)">
        <animate attributeName="rx" values="185;170;185" dur="4.5s" repeatCount="indefinite" />
      </ellipse>

      <!-- LAYER 1 (Bottom): Supabase + Razorpay Obsidian Platform -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="5s" repeatCount="indefinite" />
        <!-- Isometric Slab (180 wide, 100 iso depth) -->
        <polygon points="0,-20 175,55 0,130 -175,55" fill="url(#isoTop)" stroke="rgba(46,229,157,0.45)" stroke-width="1.4" />
        <polygon points="-175,55 0,130 0,152 -175,77" fill="url(#isoLeft)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <polygon points="175,55 0,130 0,152 175,77" fill="url(#isoRight)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="-72" y="64" fill="#2EE59D" font-family="ui-monospace, monospace" font-size="12" font-weight="700" transform="skewY(22)">SUPABASE + RAZORPAY</text>
      </g>

      <!-- Vertical Neon Data Beams -->
      <line x1="-88" y1="35" x2="-88" y2="-45" stroke="#FF6A00" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.6" />
      <line x1="88" y1="35" x2="88" y2="-45" stroke="#FFA040" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.6" />

      <!-- LAYER 2 (Middle): Floating Copper AI Engine Slab (Gemini + Agora + Murf) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,-64; 0,-74; 0,-64" dur="4.2s" repeatCount="indefinite" />
        <polygon points="0,-16 145,44 0,104 -145,44" fill="url(#isoTop)" stroke="rgba(255,106,0,0.75)" stroke-width="1.6" />
        <polygon points="-145,44 0,104 0,122 -145,62" fill="url(#copperLeft)" opacity="0.85" />
        <polygon points="145,44 0,104 0,122 145,62" fill="url(#copperRight)" opacity="0.85" />
        <!-- Glowing Isometric Copper Accent Ring -->
        <polygon points="0,-4 108,42 0,88 -108,42" fill="none" stroke="#FFA040" stroke-width="1.1" opacity="0.7" />
        <text x="-58" y="48" fill="#FFA040" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" transform="skewY(22)">GEMINI + AGORA + MURF</text>
      </g>

      <!-- LAYER 3 (Top): Levitating 3D Copper Cube + Holographic Audio Bars -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,-138; 0,-152; 0,-138" dur="3.6s" repeatCount="indefinite" />
        <!-- 3D Cube -->
        <polygon points="0,-48 54,-24 0,0 -54,-24" fill="url(#copperTop)" filter="url(#softGlow)" />
        <polygon points="-54,-24 0,0 0,54 -54,30" fill="url(#copperLeft)" />
        <polygon points="54,-24 0,0 0,54 54,30" fill="url(#copperRight)" />
        <!-- Wireframe Highlight on Cube -->
        <polygon points="0,-48 54,-24 0,0 -54,-24" fill="none" stroke="#FFD29D" stroke-width="1.2" opacity="0.8" />

        <!-- Floating 3D Equalizer Bars beside the Cube -->
        <g transform="translate(82, -26)">
          <rect x="0" y="18" width="6" height="24" rx="3" fill="#FF6A00">
            <animate attributeName="height" values="24;42;14;24" dur="1.1s" repeatCount="indefinite" />
            <animate attributeName="y" values="18;0;28;18" dur="1.1s" repeatCount="indefinite" />
          </rect>
          <rect x="12" y="8" width="6" height="34" rx="3" fill="#FFA040">
            <animate attributeName="height" values="34;16;44;34" dur="0.9s" repeatCount="indefinite" />
            <animate attributeName="y" values="8;26;-2;8" dur="0.9s" repeatCount="indefinite" />
          </rect>
          <rect x="24" y="14" width="6" height="28" rx="3" fill="url(#emeraldBar)">
            <animate attributeName="height" values="28;40;12;28" dur="1.3s" repeatCount="indefinite" />
            <animate attributeName="y" values="14;2;30;14" dur="1.3s" repeatCount="indefinite" />
          </rect>
          <rect x="36" y="20" width="6" height="22" rx="3" fill="#4DA3FF">
            <animate attributeName="height" values="22;36;10;22" dur="1.2s" repeatCount="indefinite" />
            <animate attributeName="y" values="20;6;32;20" dur="1.2s" repeatCount="indefinite" />
          </rect>
        </g>

        <!-- Floating Mini Glass Satellite Node Left -->
        <g transform="translate(-128, -22)">
          <polygon points="0,-14 26,-2 0,10 -26,-2" fill="#1F1C1A" stroke="#FFA040" stroke-width="1.2" />
          <polygon points="-26,-2 0,10 0,24 -26,12" fill="#12100F" stroke="rgba(255,255,255,0.12)" />
          <polygon points="26,-2 0,10 0,24 26,12" fill="#0B0A09" stroke="rgba(255,255,255,0.12)" />
          <circle cx="0" cy="-2" r="4" fill="#2EE59D" />
        </g>
      </g>
    </g>
  </g>
</svg>
